steps:
  # ── 1. Build API + Frontend (FastAPI & Vite SPA) ─────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.api'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-frontend:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-frontend:latest'
      - '.'

  # ── 2. Build Unified Worker ──────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-worker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.worker'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-worker:$COMMIT_SHA'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-worker:latest'
      - '.'

  # ── 3. Push images to Artifact Registry ──────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-frontend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend-latest'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-frontend:latest'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-worker'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-worker:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-worker-latest'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-worker:latest'

images:
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-frontend:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-frontend:latest'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-worker:$COMMIT_SHA'
  - '$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/superover-worker:latest'

substitutions:
  _REGION: 'asia-south1'
  _REPO_NAME: 'superover-docker'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
