note: "Ground truth for the 30 s scoring-event eval. Originally transcribed from human review\
  \ notes of the Gemini analysis (which only flagged errors); a second pass (2026-07) corrected\
  \ and completed the labels against the on-screen scoreboard - a made basket is confirmed by the\
  \ score incrementing, read directly from keyframes. Makes now carry scoreboard-verified time /\
  \ team / points. 'verified' is true only where confirmed: a bool (whole event) or a per-attribute\
  \ map (event/outcome/team/points/jersey). Jersey and missed shots (no score delta) are NOT\
  \ scoreboard-confirmable and stay unverified unless a reviewer read them. Clip URLs are never\
  \ committed - see sources.local.yaml (gitignored) or BASKETBALL_CLIPS_BASE_URL; checksums are\
  \ filled in by build_dataset.py."
