[mypy]
ignore_missing_imports = True
explicit_package_bases = True
exclude = (frontend|venv|tests|__pycache__)/

# google-cloud-firestore's namespace package doesn't expose `firestore`
# attribute through the stubs; suppress globally instead of per-call sites.
[mypy-google.cloud]
ignore_errors = True

# ── Grandfathered modules ──────────────────────────────────────────────────
# Pre-existing mypy errors out of scope for the current change. Fix in
# follow-up PRs and remove from this list. Any NEW module added to the repo
# is gated strictly by default.

[mypy-api.main]
ignore_errors = True

[mypy-api.models.schemas.media]
ignore_errors = True

[mypy-api.routes.scenes.jobs]
ignore_errors = True

[mypy-api.routes.scenes.results]
ignore_errors = True

[mypy-api.routes.scenes.videos]
ignore_errors = True

[mypy-api.routes.search]
ignore_errors = True

[mypy-config]
ignore_errors = True

[mypy-libs.db.branding]
ignore_errors = True

[mypy-libs.db.category_schemas]
ignore_errors = True

[mypy-libs.db.client]
ignore_errors = True

[mypy-libs.db.dubbing]
ignore_errors = True

